<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluency has moved</title>
<link rel="canonical" href="https://rabbijoshy.github.io/Fluency-Next/">
<!-- No-JS fallback. The script below redirects immediately; this catches
     anyone with scripting disabled and search engines. -->
<meta http-equiv="refresh" content="0; url=https://rabbijoshy.github.io/Fluency-Next/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #10151d; color: #e8edf5;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: #7aa7ff; }
  .card { max-width: 30rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .6rem; font-weight: 650; }
  p { margin: 0 0 1rem; color: #a8b3c4; }
</style>
</head>
<body>
  <div class="card">
    <h1>Fluency has moved</h1>
    <p>Taking you to the current version…</p>
    <p><a id="target" href="https://rabbijoshy.github.io/Fluency-Next/">Continue to Fluency</a></p>
  </div>
<script>
(function () {
  var BASE = 'https://rabbijoshy.github.io/Fluency-Next/';
  // Carry the query and hash across, so shared links like ?artist=bad-bunny
  // still land on the right deck rather than the generic home screen.
  var target = BASE + (location.search || '') + (location.hash || '');
  var link = document.getElementById('target');
  if (link) link.href = target;

  // Stand the retired app down on the way out: without this its service
  // worker keeps serving the old cached shell to this origin, which is the
  // usual reason a "moved" page appears to un-move itself on the next visit.
  // Best-effort and time-boxed — the redirect must not wait on it.
  function go() { location.replace(target); }
  var done = false;
  function once() { if (!done) { done = true; go(); } }
  setTimeout(once, 1200);

  var work = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      work.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      work.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
  } catch (e) { /* redirect regardless */ }

  (work.length ? Promise.all(work) : Promise.resolve()).then(once, once);
})();
</script>
</body>
</html>
